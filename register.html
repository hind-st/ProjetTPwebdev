<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celestial Atlas | Register</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <header>
        <div class="logo">
            <h1>✨ Celestial Atlas</h1>
        </div>
        <nav>
            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="register.html" class="active">Register</a></li>
            </ul>
        </nav>
    </header>

    <main class="form-page">
        <div class="form-container">
            <h2>Create an Account</h2>
            <form id="registerForm">
                <div class="form-group">
                    <label for="regName">Full Name</label>
                    <input type="text" id="regName" name="fullname" required>
                    <span class="error-message" id="nameError"></span>
                </div>
                <div class="form-group">
                    <label for="regEmail">Email Address</label>
                    <input type="email" id="regEmail" name="email" required>
                    <span class="error-message" id="regEmailError"></span>
                </div>
                <div class="form-group">
                    <label for="regPassword">Password (min. 6 characters)</label>
                    <input type="password" id="regPassword" name="password" required>
                    <span class="error-message" id="regPasswordError"></span>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirm_password" required>
                    <span class="error-message" id="confirmError"></span>
                </div>
                <button type="submit" class="btn-primary">Register</button>
                <p class="form-footer">Already have an account? <a href="login.html">Login here</a></p>
            </form>
            <div id="registerMessage" class="form-message"></div>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Celestial Atlas. All rights reserved.</p>
    </footer>
</body>

</html>
